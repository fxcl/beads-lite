[package]
name = "beads-lite"
version = "0.1.0"
edition = "2021"
description = "Minimal dependency-aware task tracker for coding agents"
license = "MIT"

[[bin]]
name = "bl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
num-bigint = "0.4"
thiserror = "2"
ureq = "3"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"

[profile.release]
lto = true
strip = true
